<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSOD 设计器</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        /* 左侧 */
        #left {
            width: 360px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #d0d0d0;
            background: #fafafa;
        }

        #toolbox {
            flex: 0 0 55%;
            overflow-y: auto;
            padding: 12px 14px;
            border-bottom: 1px solid #d0d0d0;
        }

        #codearea {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #1e1e1e;
        }

        h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        h4 {
            margin: 14px 0 6px;
            font-size: 12px;
            color: #666;
            text-transform: none;
        }

        section+section {
            margin-top: 4px;
        }

        label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 2px 8px 4px 0;
            font-size: 12px;
            color: #333;
        }

        input[type=number] {
            width: 80px;
            padding: 4px 6px;
            border: 1px solid #c8c8c8;
            border-radius: 4px;
            font-size: 12px;
        }

        input[type=text] {
            width: 100%;
            padding: 5px 7px;
            border: 1px solid #c8c8c8;
            border-radius: 4px;
            font-size: 12px;
        }

        input[type=color] {
            width: 44px;
            height: 26px;
            padding: 0;
            border: 1px solid #c8c8c8;
            border-radius: 4px;
            background: #fff;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            margin: 4px 0;
        }

        .field {
            margin: 6px 0;
        }

        .field>span {
            display: block;
            font-size: 11px;
            color: #555;
            margin-bottom: 3px;
        }

        button {
            padding: 6px 12px;
            border: 1px solid #c8c8c8;
            border-radius: 5px;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background: #f0f0f0;
        }

        button.primary {
            background: #0078d7;
            border-color: #0078d7;
            color: #fff;
        }

        button.primary:hover {
            background: #0068b3;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .presets button {
            font-size: 11px;
            padding: 3px 8px;
        }

        .hint {
            font-size: 11px;
            color: #888;
            margin: 4px 0;
        }

        /* 代码区 */
        .codebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: #252526;
            color: #ccc;
            font-size: 12px;
            border-bottom: 1px solid #333;
        }

        .codebar .btns {
            display: flex;
            gap: 6px;
        }

        #code {
            flex: 1;
            width: 100%;
            resize: none;
            border: 0;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            line-height: 1.5;
            padding: 10px;
            outline: none;
        }

        /* 右侧设计区 */
        #right {
            flex: 1;
            overflow: auto;
            background: #e3e3e3;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 24px;
        }

        #canvasWrap {
            position: relative;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .25);
        }

        #cv {
            display: block;
            cursor: crosshair;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            z-index: 99;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="left">
            <!-- 功能区 -->
            <div id="toolbox">
                <h3>功能区</h3>

                <section>
                    <h4>画布设置（像素）</h4>
                    <div class="row">
                        <label>宽 <input id="cvW" type="number" min="1" value="1920"> px</label>
                        <label>高 <input id="cvH" type="number" min="1" value="1080"> px</label>
                        <button id="applyCanvas" class="primary">应用</button>
                    </div>
                    <div class="row presets">
                        <button data-w="1920" data-h="1080">1080p</button>
                        <button data-w="1366" data-h="768">768p</button>
                        <button data-w="1280" data-h="720">720p</button>
                        <button data-w="800" data-h="600">测试</button>
                    </div>
                </section>

                <section>
                    <h4>添加元素</h4>
                    <div class="row">
                        <button id="addText" class="primary">＋ 文字</button>
                        <button id="addQr" class="primary">＋ 二维码</button>
                    </div>
                    <p class="hint">在右侧画布上点击元素选中、拖拽移动，单位均为像素。</p>
                </section>

                <section id="props">
                    <h4>元素属性</h4>
                    <p class="hint" id="propsHint">点击画布上的元素以编辑其属性。</p>
                    <div id="propsBody"></div>
                </section>

                <section>
                    <button id="delBtn" disabled>删除选中元素</button>
                </section>
            </div>

            <!-- 代码区 -->
            <div id="codearea">
                <div class="codebar">
                    <span>代码</span>
                    <div class="btns">
                        <button id="genBtn">生成</button>
                        <button id="copyBtn">复制</button>
                    </div>
                </div>
                <textarea id="code" readonly spellcheck="false"></textarea>
            </div>
        </div>

        <!-- 设计区 -->
        <div id="right">
            <div id="canvasWrap">
                <canvas id="cv"></canvas>
            </div>
        </div>
    </div>
    <div id="toast" class="toast"></div>

    <script>
        (function () {
            'use strict';

            var cv = document.getElementById('cv');
            var ctx = cv.getContext('2d');

            /* ---------- 状态 ---------- */
            var canvasW = 1920, canvasH = 1080;   // 设计画布（像素）
            var viewScale = 1;                    // 预览缩放（画布在屏幕上显示的比例）
            var elements = [];                    // [{id,type,x,y,...}]
            var nextId = 1;
            var selectedId = null;
            var drag = null;

            /* ---------- 工具 ---------- */
            function $(id) { return document.getElementById(id); }
            function toast(msg) {
                var t = $('toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(t._h);
                t._h = setTimeout(function () { t.classList.remove('show'); }, 1600);
            }
            function esc(s) { return String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"'); }
            function hex6(v) { return ('000000' + v.replace('#', '').toLowerCase()).slice(-6); }
            function hashStr(s) { var h = 0, i; for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }

            /* ---------- 画布适配 ---------- */
            function fitView() {
                var right = $('right');
                var availW = right.clientWidth - 48, availH = right.clientHeight - 48;
                viewScale = Math.min(availW / canvasW, availH / canvasH);
                if (!(viewScale > 0)) viewScale = 0.1;
                cv.width = Math.max(1, Math.round(canvasW * viewScale));
                cv.height = Math.max(1, Math.round(canvasH * viewScale));
                redraw();
            }

            /* ---------- 元素绘制（坐标均为设计像素） ---------- */
            function textFont(el) { return el.size + 'px "Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif'; }

            function drawElement(el) {
                if (el.type === 'text') {
                    ctx.font = textFont(el);
                    ctx.textBaseline = 'top';
                    ctx.textAlign = 'left';
                    ctx.fillStyle = el.color;
                    ctx.fillText(el.text, el.x, el.y);
                } else if (el.type === 'qr') {
                    drawQrPreview(el);
                }
            }

            /* 二维码预览：按内容生成确定性伪随机图案 + 三个定位角（占位，非真实二维码） */
            function drawQrPreview(el) {
                var n = 29, m = el.size / n, xx, yy, ox, oy, i;
                var seed = hashStr(el.content) >>> 0;

                ctx.fillStyle = el.bg;
                ctx.fillRect(el.x, el.y, el.size, el.size);
                ctx.fillStyle = el.fg;
                for (yy = 0; yy < n; yy++) {
                    for (xx = 0; xx < n; xx++) {
                        seed = (seed * 1664525 + 1013904223) >>> 0;
                        if ((seed >>> 16) & 1) ctx.fillRect(el.x + xx * m, el.y + yy * m, m + 0.4, m + 0.4);
                    }
                }
                var finder = function (fx, fy) {
                    var v;
                    for (yy = 0; yy < 7; yy++) for (xx = 0; xx < 7; xx++) {
                        v = (xx === 0 || xx === 6 || yy === 0 || yy === 6 || (xx >= 2 && xx <= 4 && yy >= 2 && yy <= 4)) ? 1 : 0;
                        if (v) ctx.fillRect(el.x + (fx + xx) * m, el.y + (fy + yy) * m, m + 0.4, m + 0.4);
                    }
                };
                finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
            }

            function textWidth(el) {
                ctx.font = textFont(el);
                return ctx.measureText(el.text).width;
            }
            function boundsOf(el) {
                if (el.type === 'text') return { x: el.x, y: el.y, w: Math.max(1, textWidth(el)), h: el.size };
                return { x: el.x, y: el.y, w: el.size, h: el.size };
            }

            function redraw() {
                ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
                ctx.clearRect(0, 0, canvasW, canvasH);
                ctx.fillStyle = '#0078D7';
                ctx.fillRect(0, 0, canvasW, canvasH);

                elements.forEach(drawElement);

                if (selectedId) {
                    var b = boundsOf(getEl(selectedId));
                    ctx.strokeStyle = '#ff3b30';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([6, 4]);
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                    ctx.setLineDash([]);
                    // 左上角标记
                    ctx.fillStyle = '#ff3b30';
                    ctx.fillRect(b.x - 3, b.y - 3, 6, 6);
                }
            }

            /* ---------- 元素管理 ---------- */
            function getEl(id) { for (var i = 0; i < elements.length; i++) if (elements[i].id === id) return elements[i]; return null; }
            function addEl(el) { el.id = nextId++; elements.push(el); selectEl(el.id); redraw(); regen(); }

            function addText() {
                addEl({ type: 'text', x: 0, y: 0, text: '示例文字', size: 28, color: '#ffffff' });
            }
            function addQr() {
                addEl({ type: 'qr', x: 0, y: 0, size: 232, content: 'https://example.com', fg: '#0078d7', bg: '#ffffff', quiet: 2 });
            }

            function selectEl(id) {
                selectedId = id;
                $('delBtn').disabled = (id === null);
                renderProps();
                redraw();
            }
            function deleteSelected() {
                if (selectedId === null) return;
                elements = elements.filter(function (e) { return e.id !== selectedId; });
                selectEl(null);
                regen();
            }

            /* ---------- 命中与拖拽 ---------- */
            function toDesign(e) {
                var r = cv.getBoundingClientRect();
                return { x: (e.clientX - r.left) / viewScale, y: (e.clientY - r.top) / viewScale };
            }
            function hitTest(p) {
                for (var i = elements.length - 1; i >= 0; i--) {
                    var b = boundsOf(elements[i]);
                    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return elements[i];
                }
                return null;
            }

            cv.addEventListener('mousedown', function (e) {
                var p = toDesign(e);
                var el = hitTest(p);
                if (el) { selectEl(el.id); drag = { id: el.id, dx: p.x - el.x, dy: p.y - el.y }; }
                else { selectEl(null); }
            });
            window.addEventListener('mousemove', function (e) {
                if (!drag) return;
                var el = getEl(drag.id);
                if (!el) { drag = null; return; }
                var p = toDesign(e);
                el.x = Math.max(0, Math.round(p.x - drag.dx));
                el.y = Math.max(0, Math.round(p.y - drag.dy));
                redraw(); regen();
            });
            window.addEventListener('mouseup', function () { drag = null; });
            window.addEventListener('resize', fitView);

            /* ---------- 属性面板 ---------- */
            function field(label, input) {
                var d = document.createElement('div');
                d.className = 'field';
                var s = document.createElement('span');
                s.textContent = label;
                d.appendChild(s);
                d.appendChild(input);
                return d;
            }
            function numInput(v, on) {
                var i = document.createElement('input');
                i.type = 'number'; i.min = 0; i.value = v; i.style.width = '100%';
                i.addEventListener('input', function () { on(parseInt(i.value, 10) || 0); });
                return i;
            }
            function textInput(v, on) {
                var i = document.createElement('input');
                i.type = 'text'; i.value = v;
                i.addEventListener('input', function () { on(i.value); });
                return i;
            }
            function colorInput(v, on) {
                var i = document.createElement('input');
                i.type = 'color'; i.value = v;
                i.addEventListener('input', function () { on(i.value); });
                return i;
            }

            function renderProps() {
                var body = $('propsBody');
                body.innerHTML = '';
                $('propsHint').style.display = selectedId ? 'none' : 'block';
                var el = selectedId ? getEl(selectedId) : null;
                if (!el) return;

                function commit() { redraw(); regen(); }

                if (el.type === 'text') {
                    body.appendChild(field('内容', textInput(el.text, function (v) { el.text = v; commit(); })));
                    body.appendChild(field('X（像素）', numInput(el.x, function (v) { el.x = v; commit(); })));
                    body.appendChild(field('Y（像素）', numInput(el.y, function (v) { el.y = v; commit(); })));
                    body.appendChild(field('字号（像素）', numInput(el.size, function (v) { el.size = Math.max(1, v); commit(); })));
                    body.appendChild(field('颜色', colorInput(el.color, function (v) { el.color = v; commit(); })));
                } else if (el.type === 'qr') {
                    body.appendChild(field('内容', textInput(el.content, function (v) { el.content = v; commit(); })));
                    body.appendChild(field('X（像素）', numInput(el.x, function (v) { el.x = v; commit(); })));
                    body.appendChild(field('Y（像素）', numInput(el.y, function (v) { el.y = v; commit(); })));
                    body.appendChild(field('尺寸（总宽高，像素）', numInput(el.size, function (v) { el.size = Math.max(1, v); commit(); })));
                    body.appendChild(field('留白（模块数）', numInput(el.quiet, function (v) { el.quiet = Math.max(0, v); commit(); })));
                    body.appendChild(field('内容色', colorInput(el.fg, function (v) { el.fg = v; commit(); })));
                    body.appendChild(field('背景色', colorInput(el.bg, function (v) { el.bg = v; commit(); })));
                }
            }

            /* ---------- 代码生成 ---------- */
            function regen() {
                $('code').value = generateCode();
            }

            function generateCode() {
                var lines = [];
                lines.push('/* === 设计器生成 === 画布 ' + canvasW + 'x' + canvasH +
                    '，等比例缩放至 SCREEN_W x SCREEN_H 内完整显示 === */');
                lines.push('/* 将本代码块放入渲染区（rctx 可用处）；文字需在 font_load 成功后绘制 */');
                lines.push('{');
                lines.push('    const float SCALE = (SCREEN_W / ' + canvasW + '.0f) < (SCREEN_H / ' + canvasH + '.0f)');
                lines.push('                        ? (SCREEN_W / ' + canvasW + '.0f) : (SCREEN_H / ' + canvasH + '.0f);');
                lines.push('    const int OX = (int)((SCREEN_W - ' + canvasW + '.0f * SCALE) / 2.0f);');
                lines.push('    const int OY = (int)((SCREEN_H - ' + canvasH + '.0f * SCALE) / 2.0f);');
                lines.push('');

                elements.forEach(function (el) {
                    if (el.type === 'text') {
                        lines.push('    /* 文字 */');
                        lines.push('    font_draw_text(&rctx, OX + (int)(' + el.x + ' * SCALE), OY + (int)(' + el.y + ' * SCALE),');
                        lines.push('                   "' + esc(el.text) + '", 0x' + hex6(el.color) + 'U, (unsigned int)(' + el.size + ' * SCALE));');
                        lines.push('');
                    } else if (el.type === 'qr') {
                        lines.push('    /* 二维码 */');
                        lines.push('    {');
                        lines.push('        qr_matrix qr;');
                        lines.push('        qr_style style = {');
                        lines.push('            .fg = 0x' + hex6(el.fg) + 'U,');
                        lines.push('            .bg = 0x' + hex6(el.bg) + 'U,');
                        lines.push('            .quiet = ' + el.quiet + ',');
                        lines.push('        };');
                        lines.push('        if (qr_generate_text(&qr, "' + esc(el.content) + '", 1, 10) == 0)');
                        lines.push('        {');
                        lines.push('            qr_draw(&rctx, &qr, OX + (int)(' + el.x + ' * SCALE), OY + (int)(' + el.y + ' * SCALE),');
                        lines.push('                    (int)(' + el.size + ' * SCALE), &style);');
                        lines.push('            qr_matrix_free(&qr);');
                        lines.push('        }');
                        lines.push('    }');
                        lines.push('');
                    }
                });

                lines.push('}');
                return lines.join('\n');
            }

            /* ---------- 事件绑定 ---------- */
            $('applyCanvas').addEventListener('click', function () {
                var w = parseInt($('cvW').value, 10), h = parseInt($('cvH').value, 10);
                if (!(w > 0) || !(h > 0)) { toast('画布宽高必须为正整数'); return; }
                canvasW = w; canvasH = h;
                fitView();
                regen();
                toast('画布已设为 ' + w + 'x' + h);
            });
            document.querySelectorAll('.presets button').forEach(function (b) {
                b.addEventListener('click', function () {
                    $('cvW').value = b.dataset.w; $('cvH').value = b.dataset.h;
                    $('applyCanvas').click();
                });
            });
            $('addText').addEventListener('click', addText);
            $('addQr').addEventListener('click', addQr);
            $('delBtn').addEventListener('click', deleteSelected);
            $('genBtn').addEventListener('click', function () {
                regen();
                toast('已生成');
            });
            $('copyBtn').addEventListener('click', function () {
                var code = $('code').value;
                function done() { toast('代码已复制到剪贴板'); }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(code).then(done, function () { fallbackCopy(code); done(); });
                } else { fallbackCopy(code); done(); }
            });
            function fallbackCopy(text) {
                var ta = $('code');
                ta.removeAttribute('readonly');
                ta.select();
                try { document.execCommand('copy'); } catch (e) { }
                ta.setAttribute('readonly', '');
            }

            /* ---------- 键盘删除 ---------- */
            window.addEventListener('keydown', function (e) {
                if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId !== null &&
                    document.activeElement && document.activeElement.tagName !== 'INPUT' &&
                    document.activeElement.tagName !== 'TEXTAREA') {
                    deleteSelected();
                }
            });

            /* ---------- 初始化 ---------- */
            fitView();
            regen();
        })();
    </script>
</body>

</html>
